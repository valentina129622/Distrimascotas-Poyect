<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Clientes y Fidelización | Distrimascotas</title>

    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/ventas.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">
            <span class="logo-text">Distrimascotas</span>
            <span class="logo-paw">🐾</span>
        </div>

        <nav class="menu">
            <a onclick="irHome()">Inicio</a>
            <a class="active">Clientes</a>
            <a onclick="irVentas()">Ventas</a>
            <a onclick="irInventario()">Gestión de Productos</a>
        </nav>

        <div class="user-area">
            <span>User</span>

            <div class="user-icon">👤</div>

            <div class="logout" onclick="cerrarSesion()">
                <img src="imagenes/icons/logout.png" alt="Cerrar sesión">
            </div>
        </div>

    </header>

    <!-- BANNER -->
    <section class="banner">
        <img src="imagenes/banner-animales.png" alt="Banner">
    </section>

    <!-- CONTENIDO -->
    <main class="ventas-container">

        <!-- FORMULARIO -->
        <section class="formulario">

            <h3>Registrar Cliente</h3>

            <label>Nombre del cliente:</label>
            <input id="nombre">

            <label>Tipo de cliente:</label>
            <select id="tipoCliente">
                <option value="Minorista">Minorista</option>
                <option value="Mayorista">Mayorista</option>
            </select>

            <label>Nombre de la tienda:</label>
            <input id="tienda">

            <label>Identificación / NIT:</label>
            <input id="identificacion">

            <label>Teléfono:</label>
            <input id="telefono">

            <label>Correo:</label>
            <input id="correo">

            <button onclick="registrarCliente()">
                Registrar Cliente
            </button>

        </section>

        <!-- TABLA CLIENTES -->
        <section class="tablas">

            <div class="tabla">

                <h3>Clientes Registrados</h3>

                <table id="tablaClientes">
                    <tr>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th>Tienda</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                    </tr>
                </table>

            </div>

        </section>

    </main>

    <!-- MODAL -->
    <div class="modal" id="modal">

        <div class="modal-content">

            <p id="modalTexto"></p>

            <button onclick="cerrarModal()">
                Continuar
            </button>

        </div>

    </div>

    <!-- JS -->
    <script src="js/clientes.js"></script>

    <script>

        function irHome() {
            window.location.href = "home.html";
        }

        function irVentas() {
            window.location.href = "ventas.html";
        }

        function irInventario() {
            window.location.href = "inventario.html";
        }

    </script>

</body>

</html>
